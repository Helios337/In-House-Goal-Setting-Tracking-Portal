openapi: 3.1.0
info:
  title: In-House Goal Setting & Tracking API
  version: 1.0.0
  description: FastAPI backend for the goal portal.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Password login (OAuth2 form)
      tags: [Auth]
  /auth/sso:
    post:
      summary: Exchange Entra id_token or demo email for backend JWT
      tags: [Auth]
  /goals/:
    post:
      summary: Create a goal on a sheet
      tags: [Goals]
    get:
      summary: List goals for current user
      tags: [Goals]
  /goals/sheets/current:
    get:
      summary: Current user's goal sheet with goals
      tags: [Goals]
  /goals/{sheet_id}/submit:
    post:
      summary: Employee submits goal sheet (requires 100% weight, active Goal Setting phase)
      tags: [Goals]
  /goals/{sheet_id}/approve:
    post:
      summary: Manager approves goal sheet
      tags: [Goals]
  /achievements/:
    post:
      summary: Log quarterly achievement (progress computed via UoM engine)
      tags: [Achievements]
  /checkins/team:
    get:
      summary: Manager list of approved sheets ready for check-in
      tags: [Checkins]
  /checkins/employee/{employee_id}:
    get:
      summary: Manager view of employee goals and progress
      tags: [Checkins]
  /checkins/:
    post:
      summary: Manager records check-in with comment
      tags: [Checkins]
  /shared-goals/cascade-options:
    get:
      summary: Admin list of managers, goals, and subordinates for cascade
      tags: [SharedGoals]
  /shared-goals/admin/cascade:
    post:
      summary: Admin push shared KPI to multiple employees
      tags: [SharedGoals]
  /reports/dashboard:
    get:
      summary: Aggregated stats and team completion heatmap data
      tags: [Reports]
  /reports/export:
    get:
      summary: CSV export of subordinate goals (manager)
      tags: [Reports]
  /events/stream:
    get:
      summary: SSE stream of realtime events
      tags: [Events]
