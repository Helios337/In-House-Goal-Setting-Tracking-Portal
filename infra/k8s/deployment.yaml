apiVersion: apps/v1
kind: Deployment
metadata:
  name: goal-portal-backend
  labels:
    app: goal-portal
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      tier: backend
  template:
    metadata:
      labels:
        tier: backend
    spec:
      containers:
      - name: backend
        image: your-registry/goal-portal-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: backend-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goal-portal-frontend
  labels:
    app: goal-portal
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      tier: frontend
  template:
    metadata:
      labels:
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: your-registry/goal-portal-frontend:latest
        ports:
        - containerPort: 3000
